<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong — Pixel Party</title><link rel="stylesheet" href="../arcade.css"><link rel="stylesheet" href="pong.css"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../../economy.css?v=2"><script src="../../economy.js?v=2"></script></head><body data-game="pong"><main class="arcade pong"><div class="hud"><div><h1>PONG</h1><p class="match-label">FIRST TO 7 · +<span data-round>0</span> TOKENS</p></div><div class="score" aria-label="Match score"><div class="score-side">YOU<strong id="you">0</strong></div><span class="score-divider" aria-hidden="true">:</span><div class="score-side cpu-score">CPU<strong id="cpu">0</strong></div></div></div><div class="stage"><canvas id="board" width="680" height="380" aria-label="Pong playing field"></canvas><div class="overlay" id="overlay"><h2 id="overlay-title">Pong</h2><p id="overlay-copy">You’re on the left. Move your paddle to return the ball. First to seven wins.</p><button class="primary" id="start">START GAME</button></div></div><p class="status" id="status" aria-live="polite">YOU VS COMPUTER</p><div class="toolbar"><button id="pause" disabled>PAUSE</button><button id="restart">RESTART</button></div><div class="touch-controls"><button id="up" aria-label="Move paddle up">↑ UP</button><button id="down" aria-label="Move paddle down">↓ DOWN</button></div><p class="instructions"><kbd>↑ ↓</kbd> or <kbd>W S</kbd> move · <kbd>P / Esc</kbd> pause<br>Or move your mouse / drag on the court.<br>On touch screens, hold the buttons to move.</p></main><script src="pong.js"></script></body></html>
