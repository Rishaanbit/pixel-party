<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris — Pixel Party</title><link rel="stylesheet" href="../arcade.css"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="../../economy.css"><script src="../../economy.js"></script></head><body data-game="tetris"><main class="arcade tetris"><div class="hud"><div><h1>TETRIS</h1></div><div class="score">SCORE <span id="score">0</span><br>LINES <span id="lines">0</span> · LV <span id="level">1</span></div></div><div class="stage"><canvas id="board" width="240" height="480" aria-label="Tetris playing field"></canvas><div class="overlay" id="overlay"><h2 id="overlay-title">Tetris</h2><p id="overlay-copy">Complete horizontal rows. Keep the stack from reaching the top.</p><button class="primary" id="start">START GAME</button></div></div><p class="next">NEXT PIECE: <span id="next">—</span> · +<span data-round>0</span> TOKENS · BEST: <span id="best">0</span></p><div class="toolbar"><button id="pause" disabled>PAUSE</button><button id="restart">RESTART</button></div><div class="touch-controls" aria-label="Game controls"><button data-action="left" aria-label="Move left">←</button><button data-action="rotate" aria-label="Rotate">↻</button><button data-action="right" aria-label="Move right">→</button><button data-action="down" aria-label="Move down">↓</button><button data-action="drop">DROP</button></div><p class="instructions"><kbd>← →</kbd> move · <kbd>↑</kbd> rotate · <kbd>↓</kbd> soft drop<br><kbd>Space</kbd> hard drop · <kbd>P / Esc</kbd> pause<br>Tap the buttons to play on touch screens.</p></main><script src="tetris.js"></script></body></html>
